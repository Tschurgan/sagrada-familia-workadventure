<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spendenkonsole</title><style>*{box-sizing:border-box}body{margin:0;background:#071c36;color:#fff4d1;font:16px system-ui;padding:20px}main{max-width:1300px;margin:auto;border:4px double #e7b54e;border-radius:28px;padding:20px;background:#102b48}h1{text-align:center;color:#ffd675}section{display:flex;justify-content:center;gap:24px;flex-wrap:wrap;margin:20px}article{text-align:center;border:2px solid #d5a74a;border-radius:18px;padding:12px;background:#123d62}button{background:#e8b94f;color:#14243b;border:0;border-radius:12px;font-size:26px;width:48px;height:42px;cursor:pointer}button:disabled{opacity:.35}output{display:inline-block;min-width:100px;font-size:24px;font-weight:bold}table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}th,td{padding:10px;text-align:right;border-bottom:1px solid #527184;white-space:nowrap}th{color:#ffd675;white-space:normal;vertical-align:bottom}th:nth-child(1),td:nth-child(1),th:nth-child(2),td:nth-child(2),th:nth-child(4),td:nth-child(4){text-align:center}th:nth-child(3),td:nth-child(3),th:nth-child(5),td:nth-child(5){text-align:center}tbody tr:nth-child(even){background:#173a56}footer{text-align:center;margin:24px;color:#ffd675;font-size:clamp(20px,4vw,40px);font-weight:bold}.scroll{overflow:auto}small{display:block;text-align:center;color:#c5d6df}</style><main><h1>Mögliche jährliche Spenden</h1><section><article>Progression<br><button id="dm" aria-label="Progression verringern">◀</button><output id="d"></output><button id="dp" aria-label="Progression erhöhen">▶</button></article><article>Grundspendensatz<br><button id="fm" aria-label="Spendensatz verringern">◀</button><output id="f"></output><button id="fp" aria-label="Spendensatz erhöhen">▶</button></article></section><div class="scroll"><table><thead><tr><th>Vermögen</th><th>Menschen mit diesem Vermögen</th><th>Faktor</th><th>Spende</th><th>Prozent des Vermögens</th><th>Summe</th></tr></thead><tbody id="rows"></tbody></table></div><footer>Gesamtsumme pro Jahr<br><span id="total"></span></footer><small>Modellrechnung auf Grundlage der vorgegebenen Vermögensgruppen. Keine Prognose tatsächlicher Spenden.</small></main><script>let d=1,f=30;const $=id=>document.getElementById(id),n=new Intl.NumberFormat('de-DE',{maximumFractionDigits:1}),p=new Intl.NumberFormat('de-DE',{minimumFractionDigits:1,maximumFractionDigits:1}),eur=new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR',maximumFractionDigits:0,minimumFractionDigits:0}),people=[1600000000,613000000,22800000,2500000,84700,3000,100,20,1];function draw(){let total=0;$('d').textContent=n.format(d/10);$('f').textContent=p.format(f/10)+' %';$('rows').innerHTML=people.map((c,i)=>{const b=10000*10**i,k=10+i*d,e=b*f*k/10000,g=c*e;total+=g;return '<tr>'+[eur.format(b),n.format(c),n.format(k/10),eur.format(e),p.format(f*k/100)+' %',eur.format(g)].map(v=>'<td>'+v+'</td>').join('')+'</tr>'}).join('');$('total').textContent=eur.format(total);$('dm').disabled=d===0;$('dp').disabled=d===80;$('fm').disabled=f===0;$('fp').disabled=f===100}function change(k,v){if(k==='d')d=Math.max(0,Math.min(80,d+v));else f=Math.max(0,Math.min(100,f+v));draw()}for(const [id,k,v] of [['dm','d',-1],['dp','d',1],['fm','f',-1],['fp','f',1]])$(id).onclick=()=>change(k,v);document.addEventListener('keydown',e=>{const a={ArrowLeft:['d',-1],ArrowRight:['d',1],ArrowDown:['f',-1],ArrowUp:['f',1]}[e.key];if(a){e.preventDefault();change(...a)}});draw()</script></html>
